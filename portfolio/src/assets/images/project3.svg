<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blue-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purple-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="emerald-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#1e293b" fill-opacity="0.9" />
  <circle cx="50" cy="35" r="14" fill="#3b82f6" />
  <rect x="75" y="27" width="130" height="16" rx="4" fill="#ffffff" />
  
  <!-- Search and Actions in Topbar -->
  <rect x="240" y="20" width="300" height="30" rx="6" fill="#334155" />
  <circle cx="260" cy="35" r="5" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <rect x="275" y="31" width="120" height="8" rx="2" fill="#94a3b8" />
  
  <rect x="1020" y="20" width="130" height="30" rx="6" fill="url(#blue-accent)" />
  <rect x="1045" y="31" width="80" height="8" rx="2" fill="#ffffff" />

  <!-- Subheader -->
  <rect x="50" y="95" width="220" height="24" rx="4" fill="#f8fafc" />
  <rect x="50" y="128" width="340" height="12" rx="3" fill="#64748b" />

  <!-- Column 1: Backlog / To Do -->
  <g transform="translate(50, 165)">
    <rect width="340" height="460" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <circle cx="25" cy="28" r="5" fill="#f59e0b" />
    <rect x="40" y="22" width="80" height="14" rx="3" fill="#e2e8f0" />
    <rect x="290" y="20" width="30" height="18" rx="9" fill="#334155" />

    <!-- Card 1.1 -->
    <g transform="translate(16, 55)" filter="url(#card-shadow)">
      <rect width="308" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="16" y="16" width="70" height="18" rx="9" fill="#ef4444" fill-opacity="0.2" />
      <rect x="24" y="21" width="54" height="8" rx="2" fill="#f87171" />
      <rect x="16" y="44" width="220" height="12" rx="3" fill="#f1f5f9" />
      <rect x="16" y="64" width="150" height="8" rx="2" fill="#64748b" />
      <circle cx="280" cy="85" r="10" fill="#3b82f6"/>
    </g>

    <!-- Card 1.2 -->
    <g transform="translate(16, 175)" filter="url(#card-shadow)">
      <rect width="308" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="16" y="16" width="60" height="18" rx="9" fill="#3b82f6" fill-opacity="0.2" />
      <rect x="24" y="21" width="44" height="8" rx="2" fill="#60a5fa" />
      <rect x="16" y="44" width="190" height="12" rx="3" fill="#f1f5f9" />
      <circle cx="280" cy="75" r="10" fill="#10b981"/>
    </g>
  </g>

  <!-- Column 2: In Progress -->
  <g transform="translate(430, 165)">
    <rect width="340" height="460" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="25" cy="28" r="5" fill="#3b82f6" />
    <rect x="40" y="22" width="100" height="14" rx="3" fill="#e2e8f0" />
    <rect x="290" y="20" width="30" height="18" rx="9" fill="#1d4ed8" fill-opacity="0.4" />

    <!-- Card 2.1 -->
    <g transform="translate(16, 55)" filter="url(#card-shadow)">
      <rect width="308" height="120" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <rect x="16" y="16" width="85" height="18" rx="9" fill="url(#blue-accent)" />
      <rect x="24" y="21" width="69" height="8" rx="2" fill="#ffffff" />
      <rect x="16" y="44" width="240" height="12" rx="3" fill="#f8fafc" />
      <rect x="16" y="64" width="200" height="8" rx="2" fill="#94a3b8" />
      <!-- Progress Bar -->
      <rect x="16" y="86" width="276" height="6" rx="3" fill="#334155" />
      <rect x="16" y="86" width="180" height="6" rx="3" fill="#3b82f6" />
    </g>

    <!-- Card 2.2 -->
    <g transform="translate(16, 190)" filter="url(#card-shadow)">
      <rect width="308" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="16" y="16" width="70" height="18" rx="9" fill="url(#purple-accent)" />
      <rect x="24" y="21" width="54" height="8" rx="2" fill="#ffffff" />
      <rect x="16" y="44" width="180" height="12" rx="3" fill="#f1f5f9" />
      <circle cx="280" cy="75" r="10" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Column 3: Completed / Done -->
  <g transform="translate(810, 165)">
    <rect width="340" height="460" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <circle cx="25" cy="28" r="5" fill="#10b981" />
    <rect x="40" y="22" width="90" height="14" rx="3" fill="#e2e8f0" />
    <rect x="290" y="20" width="30" height="18" rx="9" fill="#334155" />

    <!-- Card 3.1 -->
    <g transform="translate(16, 55)" filter="url(#card-shadow)">
      <rect width="308" height="100" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <rect x="16" y="16" width="65" height="18" rx="9" fill="url(#emerald-accent)" />
      <rect x="24" y="21" width="49" height="8" rx="2" fill="#ffffff" />
      <rect x="16" y="44" width="210" height="12" rx="3" fill="#f1f5f9" />
      <rect x="16" y="64" width="120" height="8" rx="2" fill="#64748b" />
      <circle cx="280" cy="80" r="10" fill="#10b981"/>
    </g>

    <!-- Card 3.2 -->
    <g transform="translate(16, 170)" filter="url(#card-shadow)">
      <rect width="308" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="16" y="16" width="65" height="18" rx="9" fill="url(#emerald-accent)" />
      <rect x="24" y="21" width="49" height="8" rx="2" fill="#ffffff" />
      <rect x="16" y="44" width="160" height="12" rx="3" fill="#f1f5f9" />
      <circle cx="280" cy="75" r="10" fill="#8b5cf6"/>
    </g>
  </g>
</svg>
